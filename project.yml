name: Plain

options:
  bundleIdPrefix: co.studio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # The app's name is not settled yet. Change APP_NAME here and the bundle
    # ids, the app group and the entitlements all follow — nothing else to edit.
    APP_NAME: plain
    DEVELOPMENT_TEAM: T9F78GA3Y9
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "214"

packages:
  PlainKit:
    path: Packages/PlainKit

targets:
  Plain:
    type: application
    platform: iOS
    sources:
      - path: App/Plain
        excludes:
          - "Support/Info.plist"
          - "Support/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Plain
        PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.$(APP_NAME)
        INFOPLIST_FILE: App/Plain/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Plain/Support/Plain.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: PlainKit
        product: PlainDomain
      - package: PlainKit
        product: PlainDesignSystem
      - package: PlainKit
        product: PlainPersistence
      - package: PlainKit
        product: PlainActivity
      - target: PlainWidgets
      - target: PlainShare

  PlainShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/PlainShare
        excludes:
          - "Info.plist"
      - path: App/Plain/Resources/Fonts
    settings:
      base:
        PRODUCT_NAME: PlainShare
        PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.$(APP_NAME).share
        INFOPLIST_FILE: App/PlainShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Plain/Support/PlainShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: PlainKit
        product: PlainDomain
      - package: PlainKit
        product: PlainDesignSystem
      - package: PlainKit
        product: PlainPersistence

  PlainWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/PlainWidgets
        excludes:
          - "Info.plist"
      - path: App/Plain/Resources/Fonts
    settings:
      base:
        PRODUCT_NAME: PlainWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.$(APP_NAME).widgets
        INFOPLIST_FILE: App/PlainWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Plain/Support/PlainWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: PlainKit
        product: PlainDomain
      - package: PlainKit
        product: PlainDesignSystem
      - package: PlainKit
        product: PlainActivity

  PlainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PlainTests
    dependencies:
      - package: PlainKit
        product: PlainDomain
      - package: PlainKit
        product: PlainPersistence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  PlainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/PlainUITests
    dependencies:
      - target: Plain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Plain

  PlainCommerceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PlainCommerceTests
      - path: Configuration/Plain.storekit
        buildPhase: resources
    dependencies:
      - target: Plain
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plain.app/Plain"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PlainAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PlainAppTests
    dependencies:
      - target: Plain
      - package: PlainKit
        product: PlainDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plain.app/Plain"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Plain:
    build:
      targets:
        Plain: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PlainTests
        - PlainUITests
        - PlainAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Plain-StoreKit:
    build:
      targets:
        Plain: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/Plain.storekit
      environmentVariables:
        PLAIN_ROUTE: pro
    test:
      config: Debug
      testPlans:
        - path: Configuration/Commerce.xctestplan
          defaultPlan: true
